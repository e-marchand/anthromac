# ComputerVisionPipeline Configuration

# Project Settings
project:
  name: "ComputerVisionPipeline"
  version: "1.0.0"
  description: "Modular computer vision pipeline"

# Data Paths
data:
  raw_path: "data/raw/"
  processed_path: "data/processed/"
  external_path: "data/external/"
  annotations_path: "data/annotations/"

  # Dataset configuration
  datasets:
    coco:
      train_images: "data/external/coco/train2017/"
      val_images: "data/external/coco/val2017/"
      train_annotations: "data/external/coco/annotations/instances_train2017.json"
      val_annotations: "data/external/coco/annotations/instances_val2017.json"

# Model Settings
models:
  # Model cache
  cache_dir: "models/saved_models/"
  checkpoints_dir: "models/checkpoints/"
  onnx_dir: "models/onnx/"
  tensorrt_dir: "models/tensorrt/"

  # Available tasks
  available_tasks:
    - detection
    - segmentation
    - tracking
    - depth
    - pose

  # Default models
  defaults:
    detection: "yolov8m"
    segmentation: "sam_vit_b"
    tracking: "bytetrack"
    depth: "midas_v31"

# Object Detection
detection:
  enabled: true

  # Model selection
  model: "yolov8m"  # yolov8n, yolov8s, yolov8m, yolov8l, yolov8x, faster_rcnn, detr

  # Inference parameters
  conf_threshold: 0.5
  iou_threshold: 0.45
  max_det: 300
  agnostic_nms: false

  # Image preprocessing
  img_size: 640
  stride: 32

  # Classes
  num_classes: 80  # COCO classes
  class_names: null  # Load from dataset if null

  # Training
  training:
    epochs: 100
    batch_size: 16
    learning_rate: 0.001
    weight_decay: 0.0005
    warmup_epochs: 3
    optimizer: "adam"  # adam, sgd, adamw
    scheduler: "cosine"  # cosine, step, multistep

    # Data augmentation
    augmentation:
      hsv_h: 0.015
      hsv_s: 0.7
      hsv_v: 0.4
      degrees: 0.0
      translate: 0.1
      scale: 0.5
      shear: 0.0
      perspective: 0.0
      flipud: 0.0
      fliplr: 0.5
      mosaic: 1.0
      mixup: 0.0

# Segmentation
segmentation:
  enabled: true

  # Model selection
  model: "sam_vit_b"  # sam_vit_b, sam_vit_l, sam_vit_h, mask_rcnn, unet

  # SAM specific
  sam:
    points_per_side: 32
    pred_iou_thresh: 0.88
    stability_score_thresh: 0.95
    crop_n_layers: 0
    crop_n_points_downscale_factor: 1

  # Mask R-CNN specific
  mask_rcnn:
    score_threshold: 0.5
    nms_threshold: 0.5
    mask_threshold: 0.5

  # U-Net specific
  unet:
    n_classes: 1
    in_channels: 3
    depth: 5
    start_filters: 64

# Tracking
tracking:
  enabled: true

  # Model selection
  tracker: "bytetrack"  # bytetrack, strongsort, deepsort

  # ByteTrack parameters
  bytetrack:
    track_thresh: 0.5
    track_buffer: 30
    match_thresh: 0.8
    min_box_area: 10

  # StrongSORT parameters
  strongsort:
    reid_model: "osnet_x1_0"
    max_dist: 0.2
    max_iou_distance: 0.7
    max_age: 70
    n_init: 3

  # DeepSORT parameters
  deepsort:
    max_cosine_distance: 0.2
    nn_budget: 100
    max_age: 30

# Depth Estimation
depth:
  enabled: true

  # Model selection
  model: "midas_v31"  # midas_v31, midas_v21_small, dpt_large

  # Output
  output_type: "relative"  # relative, metric
  normalize: true

# 3D Vision (NeRF)
nerf:
  enabled: false

  # Model parameters
  num_layers: 8
  hidden_dim: 256
  num_samples: 64
  num_importance: 128

  # Training
  learning_rate: 0.0005
  lr_decay: 250
  chunk: 1024 * 32
  netchunk: 1024 * 64

# Data Augmentation
augmentation:
  enabled: true
  library: "albumentations"  # albumentations, imgaug

  # Albumentations pipeline
  transforms:
    - name: "RandomCrop"
      params:
        height: 640
        width: 640
        p: 0.5

    - name: "HorizontalFlip"
      params:
        p: 0.5

    - name: "ColorJitter"
      params:
        brightness: 0.2
        contrast: 0.2
        saturation: 0.2
        hue: 0.1
        p: 0.5

    - name: "GaussianBlur"
      params:
        blur_limit: 3
        p: 0.1

  # Advanced augmentations
  advanced:
    mosaic: 0.5
    mixup: 0.0
    cutmix: 0.0
    copy_paste: 0.0

# Preprocessing
preprocessing:
  # Resize
  resize:
    enabled: true
    size: [640, 640]
    keep_ratio: true

  # Normalization
  normalization:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

  # Padding
  padding:
    mode: "constant"  # constant, edge, reflect
    value: 114

# Postprocessing
postprocessing:
  # Non-maximum suppression
  nms:
    method: "standard"  # standard, soft, matrix
    iou_threshold: 0.45

  # Filtering
  filtering:
    min_area: 0
    max_area: null
    min_confidence: 0.0

  # Smoothing (for video)
  smoothing:
    enabled: false
    window_size: 5

# Optimization
optimization:
  # TensorRT
  tensorrt:
    enabled: false
    precision: "fp16"  # fp32, fp16, int8
    max_batch_size: 1
    workspace_size: 4  # GB

  # ONNX
  onnx:
    enabled: true
    opset_version: 16
    simplify: true
    dynamic_axes: true

  # Quantization
  quantization:
    enabled: false
    method: "post_training_static"  # post_training_static, qat
    calibration_samples: 1000

# Training Settings
training:
  # Device
  device: "cuda"  # cuda, cpu, mps
  gpu_ids: [0]
  distributed: false

  # Checkpointing
  checkpoint:
    enabled: true
    save_every_n_epochs: 10
    save_best_only: false
    monitor: "val_map"
    mode: "max"

  # Early stopping
  early_stopping:
    enabled: true
    patience: 20
    min_delta: 0.001
    monitor: "val_map"

  # Mixed precision
  mixed_precision: true
  gradient_clip: 10.0

  # Logging
  log_every_n_steps: 10
  val_every_n_epochs: 1

# Evaluation Settings
evaluation:
  # Metrics
  metrics:
    detection:
      - map
      - map50
      - map75
      - precision
      - recall

    segmentation:
      - iou
      - dice
      - pixel_accuracy

    tracking:
      - mota
      - motp
      - idf1
      - id_switches

  # Visualization
  visualization:
    enabled: true
    save_predictions: true
    show_labels: true
    show_confidence: true
    line_width: 2

# Video Processing
video:
  # Input
  input:
    fps: null  # Use original FPS if null
    start_frame: 0
    end_frame: null
    skip_frames: 0

  # Output
  output:
    fps: 30
    codec: "mp4v"  # mp4v, h264, h265
    quality: 5  # 0-10, lower is better

  # Real-time processing
  realtime:
    enabled: false
    buffer_size: 30
    display: true

# API Settings
api:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  reload: false

  # Rate limiting
  rate_limit:
    enabled: true
    requests_per_minute: 60

  # Upload limits
  max_upload_size: 100  # MB
  allowed_extensions: [".jpg", ".jpeg", ".png", ".bmp", ".mp4", ".avi"]

  # CORS
  cors:
    enabled: true
    origins: ["*"]

# MLOps
mlops:
  # MLflow
  mlflow:
    enabled: true
    tracking_uri: "http://localhost:5000"
    experiment_name: "ComputerVisionPipeline"
    log_models: true

  # Weights & Biases
  wandb:
    enabled: false
    project: "cv-pipeline"
    entity: null

  # DVC
  dvc:
    enabled: true
    remote: "s3://my-bucket/cv-pipeline"

# Monitoring
monitoring:
  enabled: true

  # Performance
  performance:
    log_fps: true
    log_latency: true
    log_memory: true

  # Model drift
  drift_detection:
    enabled: true
    reference_data: "data/reference/"
    threshold: 0.1

  # Alerts
  alerts:
    enabled: false
    email: "alerts@example.com"

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/cv_pipeline.log"
  rotation: "1 day"
  retention: "30 days"

# Paths
paths:
  models: "models/saved_models/"
  logs: "logs/"
  cache: ".cache/"
  artifacts: "artifacts/"
  experiments: "experiments/"

# Performance
performance:
  num_workers: 4
  prefetch_factor: 2
  pin_memory: true
  persistent_workers: true
