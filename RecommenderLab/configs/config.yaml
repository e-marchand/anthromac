# RecommenderLab Configuration

# Project Settings
project:
  name: "RecommenderLab"
  version: "1.0.0"
  description: "Scalable multi-algorithm recommendation system"

# Data Paths
data:
  raw_path: "data/raw/"
  processed_path: "data/processed/"
  external_path: "data/external/"
  features_path: "data/features/"

  # Data validation
  validation:
    min_interactions: 5  # Minimum interactions per user
    min_users_per_item: 3
    check_duplicates: true
    check_outliers: true

# Model Configuration
models:
  # Available models
  available:
    - popularity
    - als
    - svdpp
    - ncf
    - lightfm
    - two_tower
    - graphsage
    - pinsage
    - transformer4rec
    - gru4rec

  # Default model
  default: "ncf"

  # Ensemble configuration
  ensemble:
    enabled: false
    models: ["als", "ncf", "two_tower"]
    method: "weighted_average"  # weighted_average, rank_fusion, stacking
    weights: "auto"  # auto or list of weights

# Recommendation Settings
recommendation:
  # Default number of recommendations
  default_n: 10
  max_n: 100

  # Filtering
  filter_seen: true  # Filter already interacted items
  filter_categories: []  # Categories to exclude

  # Diversity
  diversity:
    enabled: true
    method: "mmr"  # mmr, dpp, category
    lambda: 0.3  # Relevance vs diversity tradeoff (0-1)

  # Cold start handling
  cold_start:
    strategy: "hybrid"  # popularity, content, hybrid
    fallback_model: "popularity"

  # Re-ranking
  reranking:
    enabled: false
    business_rules: []
    boost_factors: {}

# Feature Engineering
features:
  # User features
  user_features:
    enabled: true
    features:
      - age_group
      - location
      - signup_date
      - activity_level
      - preferences

  # Item features
  item_features:
    enabled: true
    features:
      - category
      - price_range
      - brand
      - popularity
      - recency

  # Interaction features
  interaction_features:
    enabled: true
    features:
      - rating
      - timestamp
      - context
      - implicit_feedback

  # Text embeddings
  text_embeddings:
    model: "sentence-transformers/all-MiniLM-L6-v2"
    pooling: "mean"
    normalize: true

# Training Settings
training:
  # Data split
  split:
    method: "temporal"  # random, temporal, user_based
    train_ratio: 0.7
    validation_ratio: 0.15
    test_ratio: 0.15

  # Cross-validation
  cross_validation:
    enabled: false
    n_folds: 5
    strategy: "user_based"  # user_based, item_based, random

  # Early stopping
  early_stopping:
    enabled: true
    patience: 5
    min_delta: 0.001
    monitor: "val_ndcg@10"

  # Checkpointing
  checkpoint:
    enabled: true
    save_best: true
    save_every_n_epochs: 5

# Evaluation Settings
evaluation:
  # Metrics
  metrics:
    ranking:
      - ndcg@10
      - map@10
      - mrr
      - precision@10
      - recall@10

    beyond_accuracy:
      - coverage
      - diversity
      - novelty
      - serendipity

    online:
      - ctr
      - conversion_rate
      - engagement_time

  # Cutoffs
  cutoffs: [5, 10, 20, 50]

  # A/B Testing
  ab_testing:
    enabled: true
    min_sample_size: 1000
    confidence_level: 0.95
    mde: 0.05  # Minimum detectable effect

# Feature Store (Feast)
feature_store:
  enabled: true
  provider: "local"  # local, gcp, aws
  online_store:
    type: "redis"
    host: "localhost"
    port: 6379
  offline_store:
    type: "file"
    path: "data/features/"

# Vector Index
vector_index:
  # Index type
  type: "faiss"  # faiss, annoy, hnswlib

  # FAISS settings
  faiss:
    index_type: "IVF"  # Flat, IVF, HNSW
    nlist: 100
    nprobe: 10
    use_gpu: false

  # Annoy settings
  annoy:
    n_trees: 10
    search_k: -1

  # Build settings
  rebuild_frequency: "daily"

# Caching
cache:
  enabled: true
  backend: "redis"  # redis, disk
  ttl: 3600  # seconds
  max_size: 10000  # number of items

  # Cache warming
  warm_cache:
    enabled: true
    popular_items: 1000
    active_users: 10000

# API Settings
api:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  reload: false

  # Rate limiting
  rate_limit:
    enabled: true
    requests_per_minute: 100

  # Timeout
  timeout: 30

  # CORS
  cors:
    enabled: true
    origins: ["*"]

# MLflow Settings
mlflow:
  enabled: true
  tracking_uri: "http://localhost:5000"
  experiment_name: "RecommenderLab"
  log_models: true
  log_artifacts: true

# Monitoring
monitoring:
  enabled: true

  # Performance monitoring
  performance:
    latency_threshold_ms: 100
    error_rate_threshold: 0.01

  # Quality monitoring
  quality:
    min_ndcg: 0.3
    min_coverage: 0.1
    max_popularity_bias: 0.5

  # Drift detection
  drift:
    enabled: true
    reference_window: 7  # days
    detection_window: 1  # day
    threshold: 0.05

  # Alerting
  alerts:
    enabled: true
    channels: ["email", "slack"]
    email: "alerts@example.com"
    slack_webhook: null

# Logging
logging:
  level: "INFO"
  format: "json"
  file: "logs/recommender.log"
  rotation: "1 day"
  retention: "30 days"

# Paths
paths:
  models: "models/saved_models/"
  logs: "logs/"
  checkpoints: "models/checkpoints/"
  artifacts: "artifacts/"
  indices: "models/indices/"

# Performance
performance:
  n_jobs: -1
  batch_size: 1024
  gpu_enabled: true
  mixed_precision: false

# Explainability
explainability:
  enabled: true
  methods:
    - similar_users
    - similar_items
    - feature_importance
  max_explanations: 3
