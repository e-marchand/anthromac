version: '3.8'

services:
  # Main API Service
  api:
    build: .
    container_name: recommender_api
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=recommender
      - POSTGRES_USER=recommender
      - POSTGRES_PASSWORD=recommender123
    depends_on:
      - redis
      - postgres
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - recommender-network

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: recommender_redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - recommender-network

  # PostgreSQL for feature store
  postgres:
    image: postgres:15-alpine
    container_name: recommender_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=recommender
      - POSTGRES_USER=recommender
      - POSTGRES_PASSWORD=recommender123
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - recommender-network

  # MLflow Tracking Server
  mlflow:
    image: python:3.10-slim
    container_name: recommender_mlflow
    ports:
      - "5000:5000"
    command: >
      sh -c "pip install mlflow psycopg2-binary &&
             mlflow server
             --backend-store-uri postgresql://recommender:recommender123@postgres:5432/mlflow
             --default-artifact-root /mlflow/artifacts
             --host 0.0.0.0
             --port 5000"
    depends_on:
      - postgres
    volumes:
      - mlflow-artifacts:/mlflow/artifacts
    restart: unless-stopped
    networks:
      - recommender-network

  # Prometheus for monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: recommender_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    restart: unless-stopped
    networks:
      - recommender-network

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: recommender_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - recommender-network

volumes:
  redis-data:
  postgres-data:
  mlflow-artifacts:
  prometheus-data:
  grafana-data:

networks:
  recommender-network:
    driver: bridge
