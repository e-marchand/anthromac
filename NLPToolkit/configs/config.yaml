# NLPToolkit Configuration

# Project Settings
project:
  name: "NLPToolkit"
  version: "1.0.0"
  description: "Multi-language NLP processing system"

# Data Paths
data:
  raw_path: "data/raw/"
  processed_path: "data/processed/"
  external_path: "data/external/"
  corpora_path: "data/corpora/"

# Language Settings
language:
  default: "en"
  auto_detect: true
  supported_languages:
    - en  # English
    - fr  # French
    - de  # German
    - es  # Spanish
    - it  # Italian
    - pt  # Portuguese
    - ru  # Russian
    - zh  # Chinese
    - ja  # Japanese
    - ko  # Korean
    - ar  # Arabic
    - hi  # Hindi

# Model Settings
models:
  # Model cache directory
  cache_dir: "models/saved_models/"
  checkpoints_dir: "models/checkpoints/"

  # Auto download models
  auto_download: true

  # Device configuration
  device: "auto"  # auto, cpu, cuda, mps
  use_fp16: false  # Use mixed precision

# Language Detection
language_detection:
  enabled: true
  model: "fasttext"  # fasttext, langdetect, cld2
  confidence_threshold: 0.8
  fallback_language: "en"

# Named Entity Recognition
ner:
  enabled: true
  model: "bert-base-multilingual-ner"  # bert-base-multilingual-ner, xlm-roberta-ner, spacy

  # Entity types
  entity_types:
    - PERSON
    - ORGANIZATION
    - LOCATION
    - DATE
    - TIME
    - MONEY
    - PERCENT
    - PRODUCT
    - EVENT

  # Custom entities
  custom_entities: []

  # Processing options
  batch_size: 32
  max_length: 512
  aggregation_strategy: "simple"  # simple, first, average, max

# Sentiment Analysis
sentiment:
  enabled: true
  model: "bert-base-multilingual-sentiment"

  # Task type
  task: "polarity"  # polarity, aspect-based, emotion

  # Labels
  labels:
    - positive
    - negative
    - neutral

  # Emotions (for emotion detection)
  emotions:
    - joy
    - sadness
    - anger
    - fear
    - surprise
    - disgust

  # Aspect-based settings
  aspect_based:
    enabled: true
    extract_aspects: true
    min_aspect_score: 0.5

# Topic Modeling
topic_modeling:
  enabled: true
  method: "bertopic"  # bertopic, lda, nmf

  # BERTopic settings
  bertopic:
    embedding_model: "all-MiniLM-L6-v2"
    n_topics: "auto"  # auto or integer
    min_topic_size: 10
    nr_topics: null  # Reduce topics to this number
    calculate_probabilities: true

  # Visualization
  visualization:
    enabled: true
    interactive: true

# Text Generation
generation:
  enabled: true

  # Models
  models:
    completion: "gpt2"  # gpt2, gpt2-medium, gpt2-large
    summarization: "t5-base"  # t5-base, t5-large, bart
    translation: "marian"  # marian, m2m100, mbart
    paraphrase: "t5-base"

  # Generation parameters
  max_length: 512
  min_length: 10
  temperature: 0.7
  top_k: 50
  top_p: 0.9
  num_beams: 4
  repetition_penalty: 1.2

  # Summarization
  summarization:
    max_length: 150
    min_length: 50
    length_penalty: 2.0
    no_repeat_ngram_size: 3

# Question Answering
qa:
  enabled: true
  model: "bert-base-squad2"  # bert-base-squad2, xlm-roberta-squad2

  # Parameters
  max_seq_length: 384
  doc_stride: 128
  max_answer_length: 30
  n_best_size: 5
  confidence_threshold: 0.5

  # Retrieval (for long documents)
  use_retrieval: true
  retriever: "tfidf"  # tfidf, dense, hybrid
  top_k_docs: 5

# Zero-Shot Classification
zero_shot:
  enabled: true
  model: "facebook/bart-large-mnli"
  hypothesis_template: "This text is about {}."
  multi_label: false

# Text Classification
classification:
  enabled: true

  # Few-shot learning
  few_shot:
    enabled: true
    method: "setfit"  # setfit, prompt-based
    n_shots: 8

  # Multi-label
  multi_label: false
  threshold: 0.5

# Embeddings
embeddings:
  # Model
  model: "sentence-transformers/all-MiniLM-L6-v2"

  # Cross-lingual
  cross_lingual:
    enabled: true
    model: "xlm-roberta-base"

  # Pooling
  pooling: "mean"  # mean, max, cls
  normalize: true

  # Caching
  cache_embeddings: true

# Text Preprocessing
preprocessing:
  # Cleaning
  cleaning:
    lowercase: false  # Language-dependent
    remove_urls: true
    remove_emails: true
    remove_phone_numbers: true
    remove_numbers: false
    remove_punctuation: false
    remove_extra_whitespace: true
    fix_unicode: true

  # Normalization
  normalization:
    expand_contractions: true
    remove_accents: false
    transliterate: false

  # Tokenization
  tokenization:
    method: "auto"  # auto, spacy, transformers, nltk
    remove_stopwords: false
    stem: false
    lemmatize: false

# Active Learning
active_learning:
  enabled: true

  # Sampling strategy
  strategy: "uncertainty"  # uncertainty, margin, entropy, diversity

  # Query parameters
  n_samples: 100
  batch_size: 10

  # Integration
  label_studio:
    enabled: false
    url: "http://localhost:8080"
    api_key: null

# Model Compression
compression:
  enabled: true

  # Distillation
  distillation:
    temperature: 2.0
    alpha: 0.5  # Weight of distillation loss

  # Quantization
  quantization:
    enabled: false
    mode: "dynamic"  # dynamic, static

  # Pruning
  pruning:
    enabled: false
    amount: 0.3

# Explainability
explainability:
  enabled: true

  # Methods
  methods:
    - lime
    - attention
    - integrated_gradients

  # LIME settings
  lime:
    num_samples: 1000
    num_features: 10

  # Visualization
  visualization:
    enabled: true
    highlight_text: true

# API Settings
api:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  reload: false

  # Rate limiting
  rate_limit:
    enabled: true
    requests_per_minute: 60

  # Timeout
  timeout: 60

  # CORS
  cors:
    enabled: true
    origins: ["*"]

  # Batch processing
  max_batch_size: 100

# Processing Settings
processing:
  # Batch processing
  batch_size: 32
  num_workers: 4

  # Caching
  cache:
    enabled: true
    backend: "redis"  # redis, disk, memory
    ttl: 3600

  # Async processing
  async_enabled: true

# MLflow Settings
mlflow:
  enabled: true
  tracking_uri: "http://localhost:5000"
  experiment_name: "NLPToolkit"
  log_models: true
  log_artifacts: true

# Monitoring
monitoring:
  enabled: true

  # Metrics
  metrics:
    - latency
    - throughput
    - accuracy
    - error_rate

  # Drift detection
  drift:
    enabled: true
    window_size: 1000
    threshold: 0.05

  # Alerts
  alerts:
    enabled: true
    email: "alerts@example.com"

# Logging
logging:
  level: "INFO"
  format: "json"
  file: "logs/nlp.log"
  rotation: "1 day"
  retention: "30 days"

# Paths
paths:
  models: "models/saved_models/"
  logs: "logs/"
  cache: ".cache/"
  artifacts: "artifacts/"

# Performance
performance:
  n_jobs: -1
  max_memory: "8GB"
  gpu_memory_fraction: 0.8

# Evaluation
evaluation:
  # Metrics
  metrics:
    ner: ["precision", "recall", "f1"]
    sentiment: ["accuracy", "f1"]
    qa: ["exact_match", "f1"]
    summarization: ["rouge", "bleu", "bertscore"]

  # Cross-validation
  cross_validation:
    enabled: true
    n_folds: 5
