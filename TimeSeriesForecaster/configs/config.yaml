# TimeSeriesForecaster Configuration

# Project Settings
project:
  name: "TimeSeriesForecaster"
  version: "1.0.0"
  description: "Production-ready time series forecasting system"

# Data Settings
data:
  raw_path: "data/raw/"
  processed_path: "data/processed/"
  external_path: "data/external/"

  # Data validation
  validation:
    min_length: 30  # Minimum time series length
    max_missing_ratio: 0.3  # Maximum allowed missing data ratio
    check_stationarity: true
    outlier_threshold: 3.0  # Standard deviations

# Model Settings
models:
  # Available models: sarima, prophet, theta, tbats, xgboost, lightgbm, lstm, gru, tft
  enabled_models:
    - prophet
    - xgboost
    - lstm

  # Ensemble configuration
  ensemble:
    enabled: true
    method: "weighted_average"  # Options: weighted_average, stacking, voting
    weights: "auto"  # Options: auto, equal, custom

  # Auto model selection
  auto_select:
    enabled: true
    metric: "rmse"  # Options: mae, rmse, mape, smape
    cv_folds: 5

# Forecasting Settings
forecasting:
  horizon: 30  # Default forecast horizon
  frequency: "D"  # D: daily, W: weekly, M: monthly, etc.

  # Confidence intervals
  confidence_level: 0.95
  interval_method: "conformal"  # Options: conformal, quantile, bootstrap

# Feature Engineering
features:
  # Lag features
  lags:
    enabled: true
    values: [1, 7, 14, 30]

  # Rolling statistics
  rolling:
    enabled: true
    windows: [7, 14, 30]
    functions: ["mean", "std", "min", "max"]

  # Date features
  date_features:
    enabled: true
    components: ["year", "month", "day", "dayofweek", "quarter", "is_weekend"]

  # Seasonal features
  seasonal:
    enabled: true
    periods: [7, 30, 365]  # Weekly, monthly, yearly

# Preprocessing
preprocessing:
  # Missing data handling
  imputation:
    method: "interpolate"  # Options: ffill, bfill, interpolate, seasonal, knn
    limit: null

  # Scaling
  scaling:
    enabled: true
    method: "standard"  # Options: standard, minmax, robust

  # Outlier handling
  outliers:
    detection: "isolation_forest"  # Options: isolation_forest, zscore, iqr
    action: "clip"  # Options: remove, clip, impute, keep

# Anomaly Detection
anomaly_detection:
  enabled: true
  method: "isolation_forest"  # Options: isolation_forest, lof, autoencoder
  contamination: 0.1
  threshold: 0.8

# Training Settings
training:
  # Train/validation/test split
  split:
    train_ratio: 0.7
    validation_ratio: 0.15
    test_ratio: 0.15

  # Cross-validation
  cross_validation:
    method: "rolling"  # Options: rolling, expanding
    n_splits: 5
    test_size: 30

  # Early stopping
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 0.001

  # Checkpointing
  checkpoint:
    enabled: true
    save_best_only: true
    monitor: "val_loss"

# Hyperparameter Optimization
optimization:
  enabled: false
  method: "optuna"  # Options: optuna, grid, random
  n_trials: 100
  timeout: 3600  # seconds

# MLflow Tracking
mlflow:
  enabled: true
  tracking_uri: "http://localhost:5000"
  experiment_name: "TimeSeriesForecaster"
  log_models: true
  log_artifacts: true

# API Settings
api:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  reload: false

  # Model serving
  serving:
    batch_size: 32
    timeout: 30
    cache_enabled: true
    cache_ttl: 300  # seconds

# Monitoring
monitoring:
  enabled: true

  # Data drift detection
  drift_detection:
    enabled: true
    reference_window: 1000
    detection_window: 100
    threshold: 0.05

  # Performance monitoring
  metrics:
    - mae
    - rmse
    - mape

  # Alerting
  alerts:
    enabled: true
    email: "admin@example.com"
    slack_webhook: null

# Logging
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "json"  # Options: json, text
  file: "logs/forecaster.log"
  rotation: "1 day"
  retention: "30 days"

# Paths
paths:
  models: "models/saved_models/"
  logs: "logs/"
  checkpoints: "models/checkpoints/"
  artifacts: "artifacts/"

# Performance
performance:
  n_jobs: -1  # Number of parallel jobs (-1 = all cores)
  cache_size: 1000  # MB
  gpu_enabled: true
  mixed_precision: false
